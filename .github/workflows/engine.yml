name: engine-tests

# QuickJS 引擎层验证：编译 quickjs-ng + bridge → 跑 conformance 测试。
# 本机受安全策略限制无法产出动态库的开发者依赖此 workflow 做运行时验证。
#
# 前置：quickjs-ng 源码放在仓库 native/third_party/quickjs/
# （必须与参考实现 quickjs-master 同版本，2026-06-04，bytecode 兼容）。
on:
  push:
    paths:
      - 'packages/tvbox_native/**'
      - 'packages/tvbox_core/**'
      - 'native/**'
      - '.github/workflows/engine.yml'
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build quickjs_bridge
        run: |
          chmod +x native/build_bridge.sh
          ./native/build_bridge.sh native/third_party/quickjs native/artifacts

      - name: Dart analyze
        run: |
          dart analyze packages/tvbox_core
          dart analyze packages/tvbox_native

      - name: Core unit tests
        run: dart test --directory packages/tvbox_core

      - name: Native tests (curl + quickjs conformance)
        env:
          TVBOX_QJS_LIB: ${{ github.workspace }}/native/artifacts/build/libquickjs_bridge.so
        run: dart test --directory packages/tvbox_native

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build quickjs_bridge (MSVC)
        shell: pwsh
        run: |
          cmake -S native/third_party/quickjs -B native/third_party/quickjs/build `
            -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_QJS_EXE=OFF -DBUILD_QJS_LIBC=ON
          cmake --build native/third_party/quickjs/build --config Release

          New-Item -ItemType Directory -Force native/artifacts/build | Out-Null
          cl /O2 /LD /I native/third_party/quickjs `
            native/quickjs_bridge.c `
            native/third_party/quickjs/quickjs-libc.c `
            /Fe:native/artifacts/build/quickjs_bridge.dll `
            /link native/third_party/quickjs/build/Release/libquickjs.lib `
            WS2_32.lib

      - name: Native tests (quickjs conformance)
        env:
          TVBOX_QJS_LIB: ${{ github.workspace }}/native/artifacts/build/quickjs_bridge.dll
        run: dart test --directory packages/tvbox_native --plain-name "QuickJS"
