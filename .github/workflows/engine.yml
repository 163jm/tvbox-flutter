name: engine

# quickjs 引擎构建与验证。源码不进仓库：
# CI 临时 clone quickjs 上游（版本硬校验 2026-06-04）→ 编译 →
# 产物提交到 native/prebuilt/ → 用产物跑 conformance 测试。
on:
  push:
    paths:
      - 'native/**'
      - 'packages/tvbox_native/**'
      - 'packages/tvbox_core/**'
      - '.github/workflows/engine.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      quickjs_ref:
        description: 'quickjs 上游 ref（默认 v0.15.1 = 2026-06-04）'
        default: 'v0.15.1'

permissions:
  contents: write

env:
  QUICKJS_VERSION: '2026-06-04'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build engine library
        run: |
          set -o pipefail
          chmod +x native/scripts/build_engine.sh
          QUICKJS_REF="${{ inputs.quickjs_ref || 'v0.15.1' }}" \
            ./native/scripts/build_engine.sh native/prebuilt/linux-x86_64 2>&1 | tee build-log.txt

      - name: Commit log (debug visibility)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-log.txt
          if git diff --cached --quiet; then
            echo "日志无变化"
          else
            git commit -m "ci: build log [skip ci]"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libquickjs_bridge-linux-x86_64
          path: native/prebuilt/linux-x86_64/libquickjs_bridge.so
          if-no-files-found: error

      - name: Commit prebuilt into repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add native/prebuilt
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "build: libquickjs_bridge.so (quickjs $QUICKJS_VERSION)"
            git push
          fi

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Download engine library
        uses: actions/download-artifact@v4
        with:
          name: libquickjs_bridge-linux-x86_64
          path: engine-lib

      - name: Dart analyze
        run: |
          dart analyze packages/tvbox_core
          dart analyze packages/tvbox_native

      - name: Core unit tests
        run: dart test --directory packages/tvbox_core

      - name: Native tests（libcurl 真实网络 + QuickJS conformance）
        env:
          TVBOX_QJS_LIB: ${{ github.workspace }}/engine-lib/libquickjs_bridge.so
        run: dart test --directory packages/tvbox_native
