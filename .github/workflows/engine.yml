name: engine

# quickjs 引擎构建与验证。源码不进仓库：
# CI 临时 clone quickjs 上游（tag v0.15.1 = 2026-06-04，与参考实现同源）→
# 编译 → 产物提交回 native/prebuilt/ → test job 重新构建并跑 conformance。
on:
  push:
    paths:
      - 'native/**'
      - 'packages/tvbox_native/**'
      - 'packages/tvbox_core/**'
      - '.github/workflows/engine.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      quickjs_ref:
        description: 'quickjs 上游 ref（默认 v0.15.1 = 2026-06-04）'
        default: 'v0.15.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build engine library
        run: |
          set -o pipefail
          chmod +x native/scripts/build_engine.sh
          QUICKJS_REF="${{ inputs.quickjs_ref || 'v0.15.1' }}" \
            ./native/scripts/build_engine.sh native/prebuilt/linux-x86_64 2>&1 | tee build-log.txt

      - name: Commit prebuilt + log into repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-log.txt || true
          git add -f native/prebuilt 2>/dev/null || true
          git status --short
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
            exit 0
          fi
          git commit -m "build: prebuilt libquickjs_bridge.so [skip ci]"
          git pull --rebase origin master || true
          git push origin HEAD:master || {
            echo "push 失败，重试一次（rebase 后）"
            git pull --rebase origin master || true
            git push origin HEAD:master
          }

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build engine library (self-contained)
        run: |
          chmod +x native/scripts/build_engine.sh
          QUICKJS_REF="${{ inputs.quickjs_ref || 'v0.15.1' }}" \
            ./native/scripts/build_engine.sh native/test-lib

      - name: Dart analyze
        run: |
          dart analyze packages/tvbox_core
          dart analyze packages/tvbox_native

      - name: Core unit tests
        run: dart test --directory packages/tvbox_core

      - name: Native tests（libcurl 真实网络 + QuickJS conformance）
        env:
          TVBOX_QJS_LIB: ${{ github.workspace }}/native/test-lib/libquickjs_bridge.so
        run: dart test --directory packages/tvbox_native
