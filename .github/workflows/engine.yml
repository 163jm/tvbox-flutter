name: engine

# quickjs 引擎构建与验证。源码不进仓库：
# CI 临时 clone quickjs 上游（tag v0.15.1 = 2026-06-04，与参考实现同源）→
# 编译 → 产物提交回 native/prebuilt/ → test job 重新构建并跑 conformance。
on:
  push:
    paths:
      - 'native/**'
      - 'packages/tvbox_native/**'
      - 'packages/tvbox_core/**'
      - '.github/workflows/engine.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      quickjs_ref:
        description: 'quickjs 上游 ref（默认 v0.15.1 = 2026-06-04）'
        default: 'v0.15.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build engine library
        run: |
          set -o pipefail
          chmod +x native/scripts/build_engine.sh
          QUICKJS_REF="${{ inputs.quickjs_ref || 'v0.15.1' }}" \
            ./native/scripts/build_engine.sh native/prebuilt/linux-x86_64 2>&1 | tee build-log.txt

      - name: Commit prebuilt + log into repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-log.txt || true
          git add -f native/prebuilt 2>/dev/null || true
          git status --short
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
            exit 0
          fi
          git commit -m "build: prebuilt libquickjs_bridge.so [skip ci]"
          git pull --rebase origin master || true
          git push origin HEAD:master || {
            echo "push 失败，重试一次（rebase 后）"
            git pull --rebase origin master || true
            git push origin HEAD:master
          }

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone quickjs v0.15.1
        run: git clone --depth 1 --branch v0.15.1 https://github.com/quickjs-ng/quickjs.git native/qjs

      - name: Build (CMake + MSVC)
        shell: pwsh
        run: |
          cmake -S native -B build -DCMAKE_BUILD_TYPE=Release `
            -DQJS_DIR="${{ github.workspace }}/native/qjs"
          cmake --build build --config Release --target quickjs_bridge

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/prebuilt/windows-x86_64 | Out-Null
          Copy-Item build/Release/quickjs_bridge.dll native/prebuilt/windows-x86_64/
          Get-ChildItem native/prebuilt/windows-x86_64/

      - name: Commit prebuilt into repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f native/prebuilt
          if (git diff --cached --quiet) { echo "产物无变化"; exit 0 }
          git commit -m "build: prebuilt quickjs_bridge.dll [skip ci]"
          git pull --rebase origin master 2>$null
          git push origin HEAD:master

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build engine library (self-contained)
        run: |
          chmod +x native/scripts/build_engine.sh
          QUICKJS_REF="${{ inputs.quickjs_ref || 'v0.15.1' }}" \
            ./native/scripts/build_engine.sh native/test-lib

      - name: Pub get
        run: dart pub get
        working-directory: packages/tvbox_core

      - name: Pub get (native)
        run: dart pub get
        working-directory: packages/tvbox_native

      - name: Dart analyze
        run: dart analyze
        working-directory: packages/tvbox_core

      - name: Dart analyze (native)
        run: dart analyze
        working-directory: packages/tvbox_native

      - name: Core unit tests
        working-directory: packages/tvbox_core
        run: dart test

      - name: "Native - curl network tests"
        working-directory: packages/tvbox_native
        run: dart test --plain-name "CurlSyncHttpClient"

      - name: "Native - quickjs conformance"
        working-directory: packages/tvbox_native
        env:
          TVBOX_QJS_LIB: ${{ github.workspace }}/native/test-lib/libquickjs_bridge.so
        run: dart test test/conformance_quickjs_test.dart

      - name: Commit test logs
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f core-test-log.txt 2>/dev/null || true
          git add -f native-test-log.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无日志可提交"
            exit 0
          fi
          git commit -m "ci: test logs [skip ci]"
          for i in 1 2 3; do
            git fetch origin
            git rebase origin/master && git push origin HEAD:master && break
            echo "push 重试 $i"
            sleep 5
          done
          git log --oneline -2
