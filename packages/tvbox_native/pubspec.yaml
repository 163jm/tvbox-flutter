name: tvbox_native
description: >-
  TVBox 原生层：libcurl 同步 HTTP、QuickJS FFI 等通过 dart:ffi 实现的
  平台无关能力。纯 Dart + FFI，不依赖 Flutter。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  ffi: ^2.1.4
  tvbox_core:
    path: ../tvbox_core

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
